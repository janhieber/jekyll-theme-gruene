---
layout: default
---
<div class="page-head">
  <div class="container">
    {%- if page.category -%}<span class="tag">{{ page.category }}</span>{%- endif -%}
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{% include date-de.html date=page.date %}</time>
  </div>
</div>
<article class="container content">
  {%- if page.image -%}<img class="hero-image" src="{{ page.image | relative_url }}" alt="">{%- endif -%}
  {{ content }}
  <p><a class="btn-outline" href="{{ '/news/' | relative_url }}">← Alle News</a></p>
</article>
